name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The build needs nothing beyond the source. The deploy job below is the only
# one granted anything more, so a pull request build cannot publish.
permissions:
  contents: read

jobs:
  # Build on every pull request as well as on main: a change to the content or
  # to the theme pin has to prove it still builds before it lands.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # enableGitInfo needs the history for "last modified"

      # The theme is a Hugo Module, so the Go toolchain resolves it from the
      # pin in go.mod. No submodule to initialise, and Renovate can see it.
      - uses: actions/setup-go@v6
        with: { go-version: stable }

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true

      - uses: actions/configure-pages@v6
        id: pages

      # --gc removes stale resources; the build is not "strict" the way
      # `mkdocs build --strict` was, so the two checks below do that job
      # explicitly rather than trusting a zero exit.
      - name: build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # PROVES: it produced the site, not merely a directory. Hugo exits 0 on a
      # project with no content at all, so the exit status above says nothing
      # on its own.
      - name: it produced the pages
        run: |
          for p in index.html performance/index.html roadmap/index.html; do
            test -s "public/$p" || { echo "::error::public/$p missing or empty"; exit 1; }
          done
          bytes=$(wc -c < public/index.html)
          echo "index.html: $bytes bytes"
          test "$bytes" -ge 4000 || { echo "::error::index.html is $bytes bytes, a shell and not the page"; exit 1; }

      # PROVES: the pages reach each other. The sidebar is the whole reason for
      # this theme, and a build where every page renders alone would still pass
      # the check above.
      - name: the pages link to each other
        run: |
          for p in index.html performance/index.html roadmap/index.html; do
            for target in performance roadmap; do
              grep -q "$target/index.html" "public/$p" || {
                echo "::error::public/$p does not link to $target"; exit 1; }
            done
          done
          echo "navigation present on all three pages"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # Only main publishes.
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Two deploys must never run at once. cancel-in-progress stays FALSE
    # deliberately: killing a publish half way through is worse than queueing.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
